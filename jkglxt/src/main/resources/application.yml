spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/jkglxt?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 9000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jkglxt.bean
  configuration:
    jdbc-type-for-null: NULL
    map-underscore-to-camel-case: true
